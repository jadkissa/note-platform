x-web: &web
  build: ./app
  environment:
    POSTGRES_HOST: db
    POSTGRES_USER: notes
    POSTGRES_PASSWORD: notes
    POSTGRES_DB: notes
  depends_on:
    db:
      condition: service_healthy

services:
  proxy:
    image: nginx:alpine
    ports: 
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web1
      - web2
  web1:
    <<: *web
    hostname: web1
  web2:
    <<: *web
    hostname: web2
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: notes
      POSTGRES_DB: notes
    volumes:
      - notes-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes -d notes"]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  notes-data: